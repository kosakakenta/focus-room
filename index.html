<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="description" content="作業中はチャットが強制消滅。ログイン不要で誰でも集まれるポモドーロ型バーチャル自習室。">

  <meta property="og:title" content="CoFocus - 集中特化のバーチャル自習室">

</head>
<body class="font-sans min-h-screen flex flex-col bg-white text-[#0f1419] select-none">

  <!-- ================= 1. 部屋一覧画面 ================= -->
  <div id="lobby-view" class="max-w-4xl mx-auto w-full p-4 md:p-6 flex-1 flex flex-col">
    <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
      <div>
        <h1 class="text-2xl font-black tracking-tight text-gray-900">CoFocus</h1>
        <p class="text-xs text-gray-400 mt-0.5">作業中はチャット強制消滅。集中特化のバーチャル自習室</p>
      </div>
      <button onclick="openCreateModal()" class="bg-[#1d9bf0] hover:bg-[#1a8cd8] text-white text-xs font-bold px-4 py-2 rounded-full transition shadow-sm active:scale-95">
        ＋ 部屋を作成
      </button>
    </div>

    <div class="mb-6">
      <input type="text" id="tag-search" oninput="renderRooms()" placeholder="タグや部屋名で検索（例: TOEIC, 卒論）" 
             class="w-full bg-[#f7f9f9] border border-transparent focus:border-[#1d9bf0] focus:bg-white rounded-full px-4 py-2.5 text-xs outline-none transition">
    </div>

    <div id="room-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </div>

  <!-- ================= 2. 新しい部屋を作成モーダル ================= -->
  <div id="create-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
    <div class="bg-white border border-gray-100 rounded-3xl p-6 w-full max-w-md shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <button onclick="closeCreateModal()" class="text-xs text-gray-500 hover:text-gray-800 font-bold">← 戻る</button>
        <h3 class="text-sm font-bold text-gray-900">新しい部屋を作成</h3>
        <div class="w-8"></div>
      </div>
      <div class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-gray-600 mb-1">部屋名（必須）</label>
          <input type="text" id="new-room-name" placeholder="例: TOEIC 800点を目指す会" class="w-full bg-[#f7f9f9] border border-gray-200 rounded-xl p-2.5 outline-none focus:border-[#1d9bf0] focus:bg-white transition">
        </div>
        <div>
          <label class="block font-semibold text-gray-600 mb-1">目標タグ（スペース区切り）</label>
          <input type="text" id="new-room-tags" placeholder="TOEIC 英語 勉強" class="w-full bg-[#f7f9f9] border border-gray-200 rounded-xl p-2.5 outline-none focus:border-[#1d9bf0] focus:bg-white transition">
        </div>
        <div>
          <label class="block font-semibold text-gray-600 mb-1">公開設定</label>
          <select id="new-room-visibility" class="w-full bg-[#f7f9f9] border border-gray-200 rounded-xl p-2.5 outline-none focus:border-[#1d9bf0]">

            <option value="link">限定公開（リンクを知っている人のみ）</option>

  <!-- ================= 3. 入室準備モーダル ================= -->

      <div class="flex justify-end gap-2 border-t border-gray-100 pt-3">

  </div>

  <!-- ================= 4. 集中作業メインルーム ================= -->
  <div id="room-view" class="hidden flex-1 flex flex-col h-screen overflow-hidden">
    <header class="h-14 border-b border-gray-200 px-4 md:px-6 flex justify-between items-center bg-white sticky top-0 z-10 shrink-0">

      </div>

      <div class="flex items-center gap-2">

    <div class="flex-1 grid grid-cols-1 md:grid-cols-12 overflow-hidden bg-white">
      
      <!-- 左カラム: ルーム情報 & ToDoリスト -->
      <div class="md:col-span-3 border-r border-gray-200 p-4 md:p-5 flex flex-col custom-scroll overflow-y-auto">
        <div class="mb-4 pb-3 border-b border-gray-100">
          <span id="current-room-vis" class="text-[10px] font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-600">公開</span>
          <h2 id="current-room-name" class="text-sm font-bold mt-1 text-gray-900 leading-snug">ルーム名</h2>
          <div id="current-room-tags" class="text-xs text-[#1d9bf0] mt-1 space-x-1 font-medium"># タグ</div>
        </div>

        <div class="bg-[#f7f9f9] p-3 rounded-2xl border border-gray-100 mb-4">

        <div class="flex-1 flex flex-col min-h-[180px]">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-bold text-gray-700">ToDo</span>
            <label class="flex items-center gap-1.5 text-xs text-gray-400 cursor-pointer hover:text-gray-600">

          <div class="flex gap-2 mt-auto pt-2">
            <input type="text" id="new-todo-input" placeholder="ToDoを追加..." class="flex-1 bg-[#f7f9f9] border border-transparent focus:border-[#1d9bf0] focus:bg-white rounded-xl px-3 py-2 text-xs outline-none transition">
            <button id="new-todo-add-btn" class="bg-[#1d9bf0] hover:bg-[#1a8cd8] text-white px-3.5 py-2 rounded-xl text-xs font-bold transition shadow-xs">＋</button>
          </div>
        </div>
      </div>

      <!-- 中央カラム: タイマー & 通知履歴 & Xシェア -->
      <div class="md:col-span-5 flex flex-col items-center justify-between p-4 md:p-6 border-r border-gray-200 bg-[#fafafa]/50 relative overflow-y-auto custom-scroll">
        <div class="w-full bg-white border border-gray-200 rounded-2xl p-3 flex justify-around items-center text-xs shadow-xs">
          <div class="flex items-center gap-1.5">
            <span class="text-gray-400 font-medium">作業</span>
            <input type="number" id="custom-work-mins" value="25" min="1" max="180" class="w-12 border border-gray-200 rounded-lg px-1.5 py-0.5 text-center font-bold outline-none focus:border-[#1d9bf0]">
            <span class="text-gray-400">分</span>
          </div>
          <div class="h-4 w-px bg-gray-200"></div>
          <div class="flex items-center gap-1.5">
            <span class="text-gray-400 font-medium">休憩</span>
            <input type="number" id="custom-break-mins" value="5" min="1" max="60" class="w-12 border border-gray-200 rounded-lg px-1.5 py-0.5 text-center font-bold outline-none focus:border-[#1d9bf0]">
            <span class="text-gray-400">分</span>
          </div>
          <button onclick="applyCustomTime()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1 rounded-lg font-bold text-xs transition">適用</button>
        </div>

        <div class="flex flex-col items-center justify-center my-6">
          <span id="timer-state-label" class="text-xs tracking-widest text-amber-500 font-bold mb-2">一時停止中</span>
          <div id="timer-display" class="text-7xl font-mono font-black tracking-tight text-gray-900 mb-6">25:00</div>
          
          <div class="flex gap-3">
            <button id="timer-start-btn" onclick="toggleTimer()" class="bg-[#1d9bf0] hover:bg-[#1a8cd8] text-white font-bold px-8 py-2.5 rounded-full text-xs transition shadow-sm active:scale-95">
              スタート
            </button>
            <button onclick="resetTimer()" class="border border-gray-300 hover:bg-gray-100 text-gray-700 px-5 py-2.5 rounded-full text-xs font-bold transition">
              リセット
            </button>
          </div>

          <!-- 休憩時に現れるX拡散ボタン -->
          <button id="x-share-btn" onclick="shareToX()" class="hidden mt-4 bg-black hover:bg-gray-800 text-white text-xs font-bold px-4 py-2 rounded-full transition flex items-center gap-1.5 shadow-sm active:scale-95">
            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            <span>成果をポストして休憩</span>
          </button>
        </div>

        <div class="w-full bg-white border border-gray-200 rounded-2xl p-3.5 shadow-xs flex flex-col gap-1.5 max-h-28 overflow-hidden">
          <div class="text-[10px] font-bold text-gray-400">アクティビティ</div>
          <div id="ticker-history" class="space-y-1 text-xs text-gray-600 overflow-y-auto custom-scroll pr-1">
            <div>💡 ルームに参加しました</div>
          </div>
        </div>
      </div>

      <!-- 右カラム: メンバー一覧 & 休憩専用チャット -->
      <div class="md:col-span-4 p-4 flex flex-col h-full overflow-hidden bg-white">
        <div class="mb-2">
          <h3 class="text-xs font-bold text-gray-700">メンバー</h3>
        </div>

        <div id="members-container" class="space-y-2 overflow-y-auto custom-scroll flex-1 pr-1 mb-3"></div>

        <!-- 休憩チャットコンテナ -->
        <div class="h-60 max-h-60 min-h-[15rem] flex flex-col border border-gray-200 rounded-2xl overflow-hidden bg-[#fafafa] shrink-0">
          <div class="bg-gray-50 px-3 py-2 border-b border-gray-200 text-[11px] font-bold text-gray-600 flex justify-between items-center">
            <span>休憩チャット</span>
          </div>

          <!-- 作業中の完全ロック画面 -->
          <div id="chat-locked-cover" class="flex-1 flex flex-col items-center justify-center p-4 text-center bg-[#fafafa]">
            <div class="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center text-gray-400 mb-1.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <div class="text-xs font-bold text-gray-700 tracking-wide">作業モード中</div>
            <p class="text-[10px] text-gray-400 mt-0.5 leading-relaxed">チャットは休憩中に利用できます</p>
          </div>

          <!-- 休憩・一時停止中のみ表示されるチャット本体 -->
          <div id="chat-active-container" class="hidden flex-1 flex flex-col overflow-hidden">
            <div id="live-chat-messages" class="flex-1 p-2.5 space-y-1.5 overflow-y-auto custom-scroll text-xs"></div>
            
            <div class="p-2 bg-white border-t border-gray-200 flex gap-1.5">
              <input type="text" id="live-chat-input" placeholder="休憩メッセージを送る..." class="flex-1 bg-[#f7f9f9] border border-gray-200 rounded-xl px-3 py-1.5 text-xs outline-none focus:border-[#1d9bf0] focus:bg-white transition">
              <button id="live-chat-send-btn" class="bg-[#1d9bf0] hover:bg-[#1a8cd8] text-white text-xs px-3.5 py-1.5 rounded-xl font-bold transition shadow-xs">送信</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCrfjEagw3LSeT_yH23X0eO34YXYexbtXM",
      authDomain: "focus-room-cde5b.firebaseapp.com",
      projectId: "focus-room-cde5b",
      storageBucket: "focus-room-cde5b.firebasestorage.app",
      messagingSenderId: "346002140928",
      appId: "1:346002140928:web:0b4c4b1e0c63712bd5cde5",
      measurementId: "G-HZSNZTGFKE"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const rtcConfig = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    let myId = localStorage.getItem('focus_user_id');
    if (!myId) {
      myId = 'user_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('focus_user_id', myId);
    }
    let myName = localStorage.getItem('focus_user_name') || '';

    let rooms = [];
    let currentRoom = null;
    let timerInterval = null;
    let heartbeatInterval = null;
    let workDuration = 25 * 60;
    let breakDuration = 5 * 60;
    let timeLeft = 25 * 60;
    let timerEndTime = 0;
    let isRunning = false;
    let isBreak = false;
    
    let elapsedWorkSeconds = 0;
    let totalFocusedMinutes = 0;
    let lastTickTime = 0;

    let todos = [];
    let preEntryTodos = [];
    let remoteMembers = [];
    let expandedMembers = {};

    let isCameraOn = false;
    let isScreenSharing = false;
    let wasCameraActiveBeforePause = false;
    let wasScreenActiveBeforePause = false;
    let cameraStream = null;
    let screenStream = null;
    let peerConnections = {};
    let remoteStreams = {};

    let unsubscribeRooms = null;
    let unsubscribeMembers = null;
    let unsubscribeTicker = null;
    let unsubscribeSignals = null;
    let unsubscribeChat = null;

    function playBeepSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playTone = (freq, delay, dur) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + delay);
          osc.stop(audioCtx.currentTime + delay + dur);
        };
        playTone(880, 0, 0.12);
        playTone(880, 0.18, 0.12);
        playTone(880, 0.36, 0.25);
      } catch (e) {
        console.error('Audio error:', e);
      }
    }

    async function deleteRoomCompletely(roomId) {
      try {
        const roomRef = db.collection('rooms').doc(roomId);
        const subCollections = ['members', 'chats', 'tickers', 'signals'];
        for (const sub of subCollections) {
          const snap = await roomRef.collection(sub).get();
          snap.forEach(async (doc) => {
            await doc.ref.delete();
          });
        }
        await roomRef.delete();
      } catch (e) {
        console.error('Delete room error:', e);
      }
    }

    async function cleanupMyPresence() {
      if (currentRoom) {
        try {
          const memRef = db.collection('rooms').doc(currentRoom.id).collection('members');
          await memRef.doc(myId).delete();
          const snapshot = await memRef.get();
          if (snapshot.empty) {
            await deleteRoomCompletely(currentRoom.id);
          }
        } catch (e) {
          console.error(e);
        }
      }
    }

    window.addEventListener('beforeunload', () => { cleanupMyPresence(); });
    window.addEventListener('pagehide', () => { cleanupMyPresence(); });

    window.onload = () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg error:', err));
      }
      if (myName) {
        document.getElementById('user-nickname').value = myName;
      }
      setupFormListeners();
      listenRooms();
      cleanupZombieRooms();

      const params = new URLSearchParams(window.location.search);
      const directRoomId = params.get('room');
      if (directRoomId) {
        selectRoom(directRoomId);
      }
    };

    async function cleanupZombieRooms() {
      try {
        const snapshot = await db.collection('rooms').get();
        const now = Date.now();
        snapshot.forEach(async (doc) => {
          const membersSnap = await doc.ref.collection('members').get();
          if (membersSnap.empty) {
            await deleteRoomCompletely(doc.id);
          } else {
            let hasActive = false;
            membersSnap.forEach(mDoc => {
              const hb = mDoc.data().lastHeartbeat || 0;
              if (now - hb < 180000) hasActive = true;
            });
            if (!hasActive) {
              await deleteRoomCompletely(doc.id);
            }
          }
        });
      } catch (e) {
        console.error("Cleanup error:", e);
      }
    }

    function setupFormListeners() {
      const preInp = document.getElementById('pre-entry-input');
      const preBtn = document.getElementById('pre-entry-add-btn');
      preInp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing) {
          e.preventDefault();
          executeAddPreEntryTodo();
        }
      });
      preBtn.addEventListener('click', (e) => {
        e.preventDefault();
        executeAddPreEntryTodo();
      });

      const todoInp = document.getElementById('new-todo-input');
      const todoBtn = document.getElementById('new-todo-add-btn');
      todoInp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing) {
          e.preventDefault();
          executeAddTodo();
        }
      });
      todoBtn.addEventListener('click', (e) => {
        e.preventDefault();
        executeAddTodo();
      });

      const chatInp = document.getElementById('live-chat-input');
      const chatBtn = document.getElementById('live-chat-send-btn');
      chatInp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing) {
          e.preventDefault();
          executeSendChatMessage();
        }
      });
      chatBtn.addEventListener('click', (e) => {
        e.preventDefault();
        executeSendChatMessage();
      });
    }

    function clearInputSafely(inpElement) {
      inpElement.value = '';
      setTimeout(() => { inpElement.value = ''; }, 10);
    }

    function executeAddPreEntryTodo() {
      const inp = document.getElementById('pre-entry-input');
      const val = inp.value.trim();
      if (!val) return;
      preEntryTodos.push(val);
      clearInputSafely(inp);
      renderPreEntryTodos();

    async function enterRoom() {
      const newUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoom.id}`;
      window.history.replaceState(null, '', newUrl);

      document.getElementById('lobby-view').classList.add('hidden');
      document.getElementById('room-view').classList.remove('hidden');
      document.getElementById('current-room-name').innerText = currentRoom.name;
      document.getElementById('current-room-vis').innerText = currentRoom.visibility === 'public' ? '公開' : '限定公開';
      document.getElementById('current-room-tags').innerText = (currentRoom.tags || []).map(t => `# ${t}`).join(' ');

      isRunning = false;
      isBreak = false;
      elapsedWorkSeconds = 0;
      totalFocusedMinutes = 0;
      document.getElementById('total-focus-time').innerText = '0分';
      document.getElementById('timer-state-label').innerText = '一時停止中';
      document.getElementById('timer-state-label').className = 'text-xs tracking-widest text-amber-500 font-bold mb-2';
      document.getElementById('timer-start-btn').innerText = 'スタート';
      document.getElementById('x-share-btn').classList.add('hidden');

      applyCustomTime();
      renderTodos();
      updateChatAccessibility();

      await updateMyFirestoreState({
        name: myName,
        status: '一時停止中',
        todos: todos,
        isTodoPublic: true,
        focusTime: '0分',
        isCamera: false,
        isScreen: false,
        lastHeartbeat: Date.now(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      // ハートビートを90秒に延長（無料枠防衛）
      heartbeatInterval = setInterval(() => {
        updateMyFirestoreState({ lastHeartbeat: Date.now() });
      }, 90000);

      unsubscribeMembers = db.collection('rooms').doc(currentRoom.id).collection('members')
        .onSnapshot((snapshot) => {
          remoteMembers = [];
          const now = Date.now();
          snapshot.forEach((doc) => {
            const data = { id: doc.id, ...doc.data() };
            if (!data.lastHeartbeat || (now - data.lastHeartbeat < 180000) || data.id === myId) {
              remoteMembers.push(data);
              if (data.id !== myId && !peerConnections[data.id]) {
                initiateCall(data.id);
              }
            }
          });
          renderMembers();
          updateWorkingCount();
        });

      listenSignaling();
      listenTickerHistory();
      listenLiveChat();
    }

    async function leaveRoom() {
      stopCamera(true);
      stopScreenShare(true);
      clearInterval(timerInterval);
      if (heartbeatInterval) clearInterval(heartbeatInterval);

      Object.keys(peerConnections).forEach(k => {
        peerConnections[k].close();
        delete peerConnections[k];
      });
      remoteStreams = {};

      await cleanupMyPresence();

      if (unsubscribeMembers) unsubscribeMembers();
      if (unsubscribeTicker) unsubscribeTicker();
      if (unsubscribeSignals) unsubscribeSignals();
      if (unsubscribeChat) unsubscribeChat();

      window.history.replaceState(null, '', window.location.pathname);
      currentRoom = null;

      document.getElementById('room-view').classList.add('hidden');
      document.getElementById('lobby-view').classList.remove('hidden');
    }

    async function updateMyFirestoreState(data) {
      if (!currentRoom) return;
      await db.collection('rooms').doc(currentRoom.id).collection('members').doc(myId).set(data, { merge: true });
    }

    // ================= WebRTC & シグナリング即時削除（DB節約） =================
    function getOrCreatePeerConnection(targetUserId) {
      if (peerConnections[targetUserId]) return peerConnections[targetUserId];
      const pc = new RTCPeerConnection(rtcConfig);
      const activeStream = cameraStream || screenStream;
      if (activeStream) {
        activeStream.getTracks().forEach(track => pc.addTrack(track, activeStream));
      }
      pc.ontrack = (event) => {
        remoteStreams[targetUserId] = event.streams[0];
        renderMembers();
      };
      pc.onicecandidate = (event) => {
        if (event.candidate) {
          sendSignal(targetUserId, { candidate: event.candidate.toJSON() });
        }
      };
      peerConnections[targetUserId] = pc;
      return pc;
    }

    async function initiateCall(targetUserId) {
      const pc = getOrCreatePeerConnection(targetUserId);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      sendSignal(targetUserId, { offer: { type: offer.type, sdp: offer.sdp } });
    }

    function sendSignal(targetUserId, data) {
      if (!currentRoom) return;
      db.collection('rooms').doc(currentRoom.id).collection('signals').add({
        from: myId,
        to: targetUserId,
        ...data,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    function listenSignaling() {
      unsubscribeSignals = db.collection('rooms').doc(currentRoom.id).collection('signals')
        .where('to', '==', myId)
        .onSnapshot((snapshot) => {
          snapshot.docChanges().forEach(async (change) => {
            if (change.type === 'added') {
              const signal = change.doc.data();
              const fromId = signal.from;
              const pc = getOrCreatePeerConnection(fromId);

              // 処理済みのシグナルを即時削除して通信量とドキュメント数を削減
              change.doc.ref.delete().catch(() => {});

              if (signal.offer) {
                await pc.setRemoteDescription(new RTCSessionDescription(signal.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                sendSignal(fromId, { answer: { type: answer.type, sdp: answer.sdp } });
              } else if (signal.answer) {
                await pc.setRemoteDescription(new RTCSessionDescription(signal.answer));
              } else if (signal.candidate) {
                try {
                  await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
                } catch (e) {
                  console.error('ICE candidate error', e);
                }
              }
            }
          });
        });
    }

    function updateTracksForAllPeers(stream) {
      Object.keys(peerConnections).forEach(targetId => {
        const pc = peerConnections[targetId];
        const senders = pc.getSenders();
        if (!stream) {
          senders.forEach(s => pc.removeTrack(s));
        } else {
          const newTrack = stream.getVideoTracks()[0];
          const sender = senders.find(s => s.track && s.track.kind === 'video');
          if (sender) {
            sender.replaceTrack(newTrack);
          } else {
            pc.addTrack(newTrack, stream);
          }
        }
        initiateCall(targetId);
      });
    }

    async function startCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        isCameraOn = true;
        updateMyFirestoreState({ isCamera: true });
        updateTracksForAllPeers(cameraStream);
        const btn = document.getElementById('camera-toggle-btn');
        if (btn) {
          btn.innerText = 'カメラ ON';
          btn.classList.add('bg-gray-900', 'text-white');
        }
        renderMembers();
      } catch (err) {
        alert('カメラへのアクセスを許可してください');
      }
    }

    function stopCamera(isManual = false) {
      if (isManual) wasCameraActiveBeforePause = false;
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      isCameraOn = false;
      updateMyFirestoreState({ isCamera: false });
      updateTracksForAllPeers(screenStream || null);
      const btn = document.getElementById('camera-toggle-btn');
      if (btn) {
        btn.innerText = 'カメラ OFF';
        btn.classList.remove('bg-gray-900', 'text-white');
      }
      renderMembers();
    }

    async function toggleCamera() {
      if (isBreak || !isRunning) {
        alert('休憩中・一時停止中はカメラをONにできません');
        return;
      }
      if (!isCameraOn) {
        wasCameraActiveBeforePause = true;
        await startCamera();
      } else {
        stopCamera(true);
      }
    }

    async function startScreenShare() {
      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        isScreenSharing = true;
        updateMyFirestoreState({ isScreen: true });
        updateTracksForAllPeers(screenStream);
        const btn = document.getElementById('screen-share-btn');
        if (btn) {
          btn.innerText = '画面共有 ON';
          btn.classList.add('bg-gray-900', 'text-white');
        }

        screenStream.getVideoTracks()[0].onended = () => {
          stopScreenShare(true);
        };
        renderMembers();
      } catch (err) {
        console.log(err);
      }
    }

    function stopScreenShare(isManual = false) {
      if (isManual) wasScreenActiveBeforePause = false;
      if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
        screenStream = null;
      }
      isScreenSharing = false;
      updateMyFirestoreState({ isScreen: false });
      updateTracksForAllPeers(cameraStream || null);
      const btn = document.getElementById('screen-share-btn');
      if (btn) {
        btn.innerText = '画面共有';
        btn.classList.remove('bg-gray-900', 'text-white');
      }
      renderMembers();
    }

    async function toggleScreenShare() {
      if (isBreak || !isRunning) {
        alert('休憩中・一時停止中は画面共有をONにできません');
        return;
      }
      if (!isScreenSharing) {
        wasScreenActiveBeforePause = true;
        await startScreenShare();
      } else {
        stopScreenShare(true);
      }
    }

    function suspendMediaStreams() {
      if (isCameraOn) {
        wasCameraActiveBeforePause = true;
        stopCamera(false);
      }
      if (isScreenSharing) {
        wasScreenActiveBeforePause = true;
        stopScreenShare(false);
      }
    }

    async function restoreMediaStreams() {
      if (wasCameraActiveBeforePause) await startCamera();
      if (wasScreenActiveBeforePause) await startScreenShare();
    }

    // ================= 高精度タイマー =================
    function applyCustomTime() {
      const wMins = parseInt(document.getElementById('custom-work-mins').value) || 25;
      const bMins = parseInt(document.getElementById('custom-break-mins').value) || 5;
      workDuration = wMins * 60;
      breakDuration = bMins * 60;
      if (!isRunning) {
        timeLeft = isBreak ? breakDuration : workDuration;
        updateTimerDisplay();
      }
    }

    function updateTimerDisplay() {
      const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const s = (timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').innerText = `${m}:${s}`;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        pauseToBreak();
      } else {
        resumeToWork();
        startTimerLoop();
      }
    }

    function startTimerLoop() {
      isRunning = true;
      document.getElementById('timer-start-btn').innerText = '一時停止';
      document.getElementById('x-share-btn').classList.add('hidden');
      updateChatAccessibility();
      
      timerEndTime = Date.now() + (timeLeft * 1000);
      lastTickTime = Date.now();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const now = Date.now();
        timeLeft = Math.max(0, Math.round((timerEndTime - now) / 1000));
        updateTimerDisplay();

        if (!isBreak) {
          const deltaSec = (now - lastTickTime) / 1000;
          elapsedWorkSeconds += deltaSec;
          if (elapsedWorkSeconds >= 60) {
            const addedMins = Math.floor(elapsedWorkSeconds / 60);
            totalFocusedMinutes += addedMins;
            elapsedWorkSeconds = elapsedWorkSeconds % 60;
            document.getElementById('total-focus-time').innerText = `${totalFocusedMinutes}分`;
            updateMyFirestoreState({ focusTime: `${totalFocusedMinutes}分` });
          }
        }
        lastTickTime = now;

        if (timeLeft <= 0) {
          playBeepSound();
          if (!isBreak) {
            switchToBreakAuto();
          } else {
            switchToWorkAuto();
          }
        }
      }, 500);
    }

    function switchToBreakAuto() {
      isBreak = true;
      timeLeft = breakDuration;
      timerEndTime = Date.now() + (breakDuration * 1000);

      document.getElementById('timer-state-label').innerText = '休憩中';
      document.getElementById('timer-state-label').className = 'text-xs tracking-widest text-amber-500 font-bold mb-2';
      document.getElementById('x-share-btn').classList.remove('hidden'); // シェアボタン表示
      
      suspendMediaStreams();

      updateTimerDisplay();
      updateMyFirestoreState({ status: '休憩中' });
      updateChatAccessibility();
    }

    function switchToWorkAuto() {
      isBreak = false;
      timeLeft = workDuration;
      timerEndTime = Date.now() + (workDuration * 1000);
      lastTickTime = Date.now();

      document.getElementById('timer-state-label').innerText = '作業中';
      document.getElementById('timer-state-label').className = 'text-xs tracking-widest text-[#1d9bf0] font-bold mb-2';
      document.getElementById('x-share-btn').classList.add('hidden');

      updateTimerDisplay();
      updateMyFirestoreState({ status: '作業中' });
      updateChatAccessibility();
      restoreMediaStreams();
      pushTicker(`🎯 ${myName} が新しい作業セットを開始しました`);
    }

    function pauseToBreak() {
      document.getElementById('timer-state-label').innerText = '一時停止中';
      document.getElementById('timer-state-label').className = 'text-xs tracking-widest text-amber-500 font-bold mb-2';
      document.getElementById('timer-start-btn').innerText = '再開する';
      document.getElementById('x-share-btn').classList.remove('hidden');
      
      suspendMediaStreams();
      
      updateMyFirestoreState({ status: '一時停止中' });
      updateChatAccessibility();
    }

    function resumeToWork() {
      document.getElementById('timer-state-label').innerText = isBreak ? '休憩中' : '作業中';
      document.getElementById('timer-state-label').className = isBreak 
        ? 'text-xs tracking-widest text-amber-500 font-bold mb-2' 
        : 'text-xs tracking-widest text-[#1d9bf0] font-bold mb-2';
      
      updateMyFirestoreState({ status: isBreak ? '休憩中' : '作業中' });
      updateChatAccessibility();

      if (!isBreak) {
        document.getElementById('x-share-btn').classList.add('hidden');
        restoreMediaStreams();
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      isBreak = false;
      timeLeft = workDuration;
      suspendMediaStreams();

      document.getElementById('timer-state-label').innerText = '一時停止中';
      document.getElementById('timer-state-label').className = 'text-xs tracking-widest text-amber-500 font-bold mb-2';
      document.getElementById('timer-start-btn').innerText = 'スタート';
      document.getElementById('x-share-btn').classList.add('hidden');
      updateTimerDisplay();
      updateMyFirestoreState({ status: '一時停止中' });
      updateChatAccessibility();
    }

    function updateWorkingCount() {

    // ================= メンバー表示 =================
    function toggleMemberDetail(memberId) {
      expandedMembers[memberId] = !expandedMembers[memberId];
      renderMembers();
    }

    function renderMembers() {
      const container = document.getElementById('members-container');
      container.innerHTML = '';

      const sortedMembers = [...remoteMembers].sort((a, b) => {
        if (a.id === myId) return -1;
        if (b.id === myId) return 1;
        return 0;
      });

      sortedMembers.forEach((m) => {
        const isMe = m.id === myId;
        const card = document.createElement('div');
        card.className = "p-3 rounded-2xl border border-gray-100 bg-white flex flex-col gap-2 shadow-xs";
        
        const isWorking = m.status === '作業中';
        const isPaused = m.status === '一時停止中';
        const isExpanded = !!expandedMembers[m.id];
        const memberTodos = m.todos || [];

        let badgeClass = "bg-gray-100 text-gray-600";
        if (isWorking) {
          badgeClass = "bg-emerald-50 text-emerald-600";
        } else if (isPaused || m.status === '休憩中') {
          badgeClass = "bg-amber-50 text-amber-600";
        }

        card.innerHTML = `
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full ${isWorking ? 'bg-emerald-500' : 'bg-amber-400'}"></span>
              <span class="font-bold text-xs text-gray-900">${m.name || '作業者'} ${isMe ? '(自分)' : ''}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${badgeClass}">${m.status || '待機中'}</span>
              <button onclick="toggleMemberDetail('${m.id}')" class="text-gray-400 hover:text-gray-700 text-xs px-1" title="詳細切替">
                ${isExpanded ? '▲' : '▼'}
              </button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 h-24 md:h-28">
            <div class="bg-[#f7f9f9] border border-gray-100 rounded-xl flex items-center justify-center relative overflow-hidden text-[10px] text-gray-400 font-medium">
              ${isMe && isCameraOn 
                ? `<video id="active-local-video" autoplay playsinline muted class="w-full h-full object-cover"></video>` 
                : (!isMe && m.isCamera && remoteStreams[m.id]
                  ? `<video id="video-camera-${m.id}" autoplay playsinline class="w-full h-full object-cover"></video>`
                  : `<span>${m.isCamera ? '受信中...' : 'カメラOFF'}</span>`)}
            </div>

            <div class="bg-[#f7f9f9] border border-gray-100 rounded-xl flex items-center justify-center relative overflow-hidden text-[10px] text-gray-400 font-medium">
              ${isMe && isScreenSharing 
                ? `<video id="active-screen-video" autoplay playsinline muted class="w-full h-full object-cover"></video>` 
                : (!isMe && m.isScreen && remoteStreams[m.id]
                  ? `<video id="video-screen-${m.id}" autoplay playsinline class="w-full h-full object-cover"></video>`
                  : `<span>${m.isScreen ? '画面共有中' : '画面共有OFF'}</span>`)}
            </div>
          </div>

          <div class="${isExpanded ? 'block' : 'hidden'} text-[11px] text-gray-500 pt-2 border-t border-gray-100 space-y-1.5">
            <div><span class="text-gray-400 font-medium">作業時間:</span> <span class="text-gray-800 font-bold">${m.focusTime || '0分'}</span></div>
            <div>
              <div class="text-gray-400 font-medium mb-1">ToDo:</div>
              ${!m.isTodoPublic 
                ? `<div class="text-gray-400 italic">🔒 非公開</div>` 
                : (memberTodos.length === 0 
                  ? `<div class="text-gray-400">登録なし</div>` 
                  : `<div class="space-y-1 pl-1">
                      ${memberTodos.map(t => `
                        <div class="flex items-center gap-1.5">
                          <span class="${t.done ? 'text-emerald-500' : 'text-gray-300'} text-[10px]">●</span>
                          <span class="${t.done ? 'line-through text-gray-400' : 'text-gray-700'} break-all">${t.text}</span>
                        </div>
                      `).join('')}
                    </div>`
                )}
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      if (isCameraOn && cameraStream) {
        const v = document.getElementById('active-local-video');
        if (v) v.srcObject = cameraStream;
      }
      if (isScreenSharing && screenStream) {
        const sv = document.getElementById('active-screen-video');
        if (sv) sv.srcObject = screenStream;
      }
      remoteMembers.forEach((m) => {
        if (m.id !== myId && remoteStreams[m.id]) {
          const cv = document.getElementById(`video-camera-${m.id}`);
          if (cv) cv.srcObject = remoteStreams[m.id];
          const sv = document.getElementById(`video-screen-${m.id}`);
          if (sv) sv.srcObject = remoteStreams[m.id];
        }
      });
    }

    function pushTicker(msg) {
      if (!currentRoom) return;
      db.collection('rooms').doc(currentRoom.id).collection('tickers').add({
        msg,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    function listenTickerHistory() {
      unsubscribeTicker = db.collection('rooms').doc(currentRoom.id).collection('tickers')
        .orderBy('timestamp', 'desc').limit(5)
        .onSnapshot((snapshot) => {
          const container = document.getElementById('ticker-history');
          container.innerHTML = '';
          const items = [];
          snapshot.forEach(doc => items.push(doc.data().msg));
          items.forEach(msg => {
            const div = document.createElement('div');
            div.className = "truncate";
            div.innerText = msg;
            container.appendChild(div);
          });
        });
    }

    // ================= 休憩チャット制御 =================
    function updateChatAccessibility() {
      const lockedCover = document.getElementById('chat-locked-cover');
      const activeContainer = document.getElementById('chat-active-container');

      if (isRunning && !isBreak) {
        lockedCover.classList.remove('hidden');
        activeContainer.classList.add('hidden');
      } else {
        lockedCover.classList.add('hidden');
        activeContainer.classList.remove('hidden');
      }
    }

    function listenLiveChat() {
      unsubscribeChat = db.collection('rooms').doc(currentRoom.id).collection('chats')
        .orderBy('timestamp', 'asc').limitToLast(50)
        .onSnapshot((snapshot) => {
          const chatBox = document.getElementById('live-chat-messages');
          chatBox.innerHTML = '';
          snapshot.forEach((doc) => {
            const d = doc.data();
            const msgRow = document.createElement('div');
            msgRow.className = "break-words leading-snug";
            msgRow.innerHTML = `<span class="font-bold text-gray-900">${d.sender}:</span> <span class="text-gray-700">${d.text}</span>`;
            chatBox.appendChild(msgRow);
          });
          chatBox.scrollTop = chatBox.scrollHeight;
        });
    }

    function copyRoomLink() {
      const shareUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoom.id}`;
      navigator.clipboard.writeText(shareUrl);
      alert('招待リンクをコピーしました！');
    }
  </script>
</body>
</html>
