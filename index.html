<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoFocus - 集中作業ルーム</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDK (CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body { background-color: #ffffff; color: #0f1419; }
    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cfd9de; border-radius: 3px; }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col bg-white text-[#0f1419]">

  <!-- ================= 1. 部屋一覧 & 作成画面 ================= -->
  <div id="lobby-view" class="max-w-4xl mx-auto w-full p-6 flex-1 flex flex-col">
    <div class="flex justify-between items-center mb-6 border-b border-gray-200 pb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-gray-900">CoFocus</h1>
        <p class="text-xs text-gray-500 mt-0.5">同じ目標を持つ仲間と集中するスペース</p>
      </div>
      <button onclick="openCreateModal()" class="bg-[#1d9bf0] hover:bg-[#1a8cd8] text-white text-sm font-bold px-4 py-2 rounded-full transition shadow-sm">
        ＋ 部屋を作成
      </button>
    </div>

    <!-- 検索バー -->
    <div class="mb-6">
      <input type="text" id="tag-search" oninput="renderRooms()" placeholder="タグや部屋名で検索（例: TOEIC, 卒論）" 
             class="w-full bg-[#eff3f4] border border-transparent focus:border-[#1d9bf0] focus:bg-white rounded-full px-4 py-2 text-sm outline-none transition">
    </div>

    <!-- 部屋カード一覧 -->
    <div id="room-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </div>

  <!-- ================= 2. 部屋作成モーダル ================= -->
  <div id="create-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white border border-gray-200 rounded-2xl p-6 w-full max-w-md shadow-xl">
      <h3 class="text-base font-bold text-gray-900 mb-4">新規ルーム作成</h3>
      <div class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-gray-600 mb-1">部屋名（必須）</label>
          <input type="text" id="new-room-name" placeholder="例: TOEIC 800点を目指す会" class="w-full bg-[#eff3f4] border border-gray-200 rounded-lg p-2.5 outline-none focus:border-[#1d9bf0] focus:bg-white">
        </div>
        <div>
          <label class="block font-semibold text-gray-600 mb-1">目標タグ（スペース区切り）</label>
          <input type="text" id="new-room-tags" placeholder="TOEIC 英語 勉強" class="w-full bg-[#eff3f4] border border-gray-200 rounded-lg p-2.5 outline-none focus:border-[#1d9bf0] focus:bg-white">
        </div>
        <div>
          <label class="block font-semibold text-gray-600 mb-1">公開設定</label>
          <select id="new-room-visibility" class="w-full bg-[#eff3f4] border border-gray-200 rounded-lg p-2.5 outline-none focus:border-[#1d9bf0]">
            <option value="public">公開（一覧に表示）</option>
            <option value="link">リンク限定</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closeCreateModal()" class="px-4 py-2 rounded-full text-gray-500 hover:bg-gray-100 text-xs font-semibold">キャンセル</button>
        <button onclick="createRoom()" class="bg-[#1d9bf0] hover:bg-[#1a8cd8] px-4 py-2 rounded-full text-white text-xs font-bold transition">作成して入室</button>
      </div>
    </div>
  </div>

  <!-- ================= 3. 入室前ToDo複数設定モーダル ================= -->
  <div id="entry-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white border border-gray-200 rounded-2xl p-6 w-full max-w-md shadow-xl flex flex-col max-h-[85vh]">
      <h3 class="text-base font-bold text-gray-900 mb-1">作業準備</h3>
      <p class="text-xs text-gray-500 mb-3">ニックネームとToDoリストを登録して入室します</p>

      <div class="mb-3">
        <label class="block font-semibold text-gray-600 text-xs mb-1">ニックネーム</label>
        <input type="text" id="user-nickname" placeholder="ニックネームを入力" class="w-full bg-[#eff3f4] border border-gray-200 rounded-lg px-3 py-2 text-xs outline-none focus:border-[#1d9bf0] focus:bg-white">
      </div>
      
      <div class="mb-2">
        <label class="block font-semibold text-gray-600 text-xs mb-1">ToDoリスト（複数登録可能）</label>
      </div>
      <!-- 入室前ToDoリスト -->
      <div id="pre-entry-todo-list" class="space-y-2 overflow-y-auto custom-scroll mb-3 max-h-36 pr-1"></div>

      <div class="flex gap-2 mb-4">
        <input type="text" id="pre-entry-input" onkeydown="if(event.key==='Enter') addPreEntryTodo()" placeholder="ToDoを入力して追加..." class="flex-1 bg-[#eff3f4] border border-gray-200 rounded-lg px-3 py-2 text-xs outline-none focus:border-[#1d9bf0] focus:bg-white">
        <button onclick="addPreEntryTodo()" class="bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs font-bold px-3 py-2 rounded-lg transition">追加</button>
      </div>

      <div class="flex justify-end gap-2 border-t border-gray-100 pt-3">
        <button onclick="confirmEntry()" class="bg-[#1d9bf0] hover:bg-[#1a8cd8] px-5 py-2 rounded-full text-white text-xs font-bold transition">部屋に入る</button>
      </div>
    </div>
  </div>

  <!-- ================= 4. 集中メイン画面 ================= -->
  <div id="room-view" class="hidden flex-1 flex flex-col h-screen">
    <!-- ヘッダー -->
    <header class="h-14 border-b border-gray-200 px-6 flex justify-between items-center bg-white sticky top-0 z-10">
      <button onclick="leaveRoom()" class="text-xs font-bold text-gray-500 hover:text-red-500 transition">← 退出</button>
      
      <!-- 何人作業中かだけ表示 -->
      <div class="flex items-center gap-3">
        <span id="active-working-count" class="text-xs font-bold text-emerald-600 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-full">
          ● 0人が集中作業中
        </span>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="copyRoomLink()" class="text-xs text-gray-600 border border-gray-300 hover:bg-gray-50 px-3 py-1.5 rounded-full transition font-medium">リンクをコピー</button>
        <button id="screen-share-btn" onclick="toggleScreenShare()" class="text-xs border border-gray-300 hover:bg-gray-50 px-3 py-1.5 rounded-full transition font-medium">画面共有</button>
        <button id="camera-toggle-btn" onclick="toggleCamera()" class="text-xs border border-gray-300 hover:bg-gray-50 px-3 py-1.5 rounded-full transition font-medium">カメラ OFF</button>
      </div>
    </header>

    <!-- 3カラムレイアウト -->
    <div class="flex-1 grid grid-cols-1 md:grid-cols-12 overflow-hidden bg-white">
      
      <!-- 左カラム: ルーム情報 & ToDoリスト -->
      <div class="md:col-span-3 border-r border-gray-200 p-5 flex flex-col custom-scroll overflow-y-auto">
        <div class="mb-5 pb-4 border-b border-gray-100">
          <span id="current-room-vis" class="text-[10px] font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-600">公開</span>
          <h2 id="current-room-name" class="text-base font-bold mt-1 text-gray-900 leading-snug">ルーム名</h2>
          <div id="current-room-tags" class="text-xs text-[#1d9bf0] mt-1 space-x-1 font-medium"># タグ</div>
        </div>

        <div class="bg-[#f7f9f9] p-3 rounded-xl border border-gray-100 mb-5">
          <div class="text-[11px] text-gray-500">この部屋で集中した時間</div>
          <div id="total-focus-time" class="text-xl font-bold text-gray-900 mt-0.5">0分</div>
        </div>

        <!-- ToDo Section -->
        <div class="flex-1 flex flex-col">
          <div class="flex justify-between items-center mb-3">
            <span class="text-xs font-bold text-gray-700">ToDoリスト</span>
            <label class="flex items-center gap-1.5 text-xs text-gray-500 cursor-pointer">
              <input type="checkbox" id="todo-public-toggle" checked onchange="toggleTodoVisibility()" class="rounded border-gray-300 text-[#1d9bf0] focus:ring-0"> 公開
            </label>
          </div>

          <div id="todo-list" class="space-y-2 mb-3"></div>

          <div class="flex gap-2 mt-auto pt-2">
            <input type="text" id="new-todo-input" onkeydown="if(event.key==='Enter') addTodo()" placeholder="ToDoを追加..." class="flex-1 bg-[#eff3f4] border border-transparent focus:border-[#1d9bf0] focus:bg-white rounded-lg px-3 py-1.5 text-xs outline-none">
            <button onclick="addTodo()" class="bg-[#1d9bf0] hover:bg-[#1a8cd8] text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">＋</button>
          </div>
        </div>
      </div>

      <!-- 中央カラム: 自由入力ポモドーロタイマー & リアルタイム通知 -->
      <div class="md:col-span-5 flex flex-col items-center justify-between p-6 border-r border-gray-200 bg-[#f7f9f9]/40 relative">
        <!-- 自由入力フォーム -->
        <div class="w-full bg-white border border-gray-200 rounded-xl p-3 flex justify-around items-center text-xs shadow-sm">
          <div class="flex items-center gap-1.5">
            <span class="text-gray-500 font-medium">作業</span>
            <input type="number" id="custom-work-mins" value="25" min="1" max="180" class="w-12 border border-gray-300 rounded px-1.5 py-0.5 text-center font-bold">
            <span class="text-gray-500">分</span>
          </div>
          <div class="h-4 w-px bg-gray-200"></div>
          <div class="flex items-center gap-1.5">
            <span class="text-gray-500 font-medium">休憩</span>
            <input type="number" id="custom-break-mins" value="5" min="1" max="60" class="w-12 border border-gray-300 rounded px-1.5 py-0.5 text-center font-bold">
            <span class="text-gray-500">分</span>
          </div>
          <button onclick="applyCustomTime()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1 rounded font-bold text-xs transition">適用</button>
        </div>

        <!-- タイマー表示本体 -->
        <div class="flex flex-col items-center justify-center my-auto">
          <span id="timer-state-label" class="text-xs tracking-widest text-[#1d9bf0] font-bold mb-2">作業中</span>
          <div id="timer-display" class="text-7xl font-mono font-bold tracking-tight text-gray-900 mb-6">25:00</div>
          
          <div class="flex gap-3">
            <button id="timer-start-btn" onclick="toggleTimer()" class="bg-[#1d9bf0] hover:bg-[#1a8cd8] text-white font-bold px-8 py-2.5 rounded-full text-xs transition shadow">
              スタート
            </button>
            <button onclick="resetTimer()" class="border border-gray-300 hover:bg-gray-100 text-gray-700 px-5 py-2.5 rounded-full text-xs font-bold transition">
              リセット
            </button>
          </div>
        </div>

        <!-- リアルタイム通知バー -->
        <div class="w-full bg-white border border-gray-200 rounded-xl p-3 min-h-[44px] flex items-center shadow-sm">
          <div id="ticker" class="text-xs text-gray-600 truncate w-full font-medium">💡 ルームに参加しました</div>
        </div>
      </div>

      <!-- 右カラム: メンバー一覧 & カメラ・画面共有横並び -->
      <div class="md:col-span-4 p-5 flex flex-col custom-scroll overflow-y-auto">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-xs font-bold text-gray-700">メンバー</h3>
          <button onclick="toggleDetailsAll()" id="collapse-all-btn" class="text-[11px] text-[#1d9bf0] hover:underline font-semibold">詳細を隠す</button>
        </div>

        <div id="members-container" class="space-y-3 flex-1 overflow-y-auto pr-1"></div>

        <!-- 休憩時コメント入力フォーム -->
        <div id="break-comment-box" class="mt-4 pt-3 border-t border-gray-200 hidden">
          <label class="block text-[11px] font-semibold text-gray-500 mb-1">休憩コメント（任意）</label>
          <div class="flex gap-2">
            <input type="text" id="break-comment-input" onkeydown="if(event.key==='Enter') postBreakComment()" placeholder="ストレッチ中..." class="flex-1 bg-[#eff3f4] border border-gray-200 rounded-lg px-3 py-1.5 text-xs outline-none">
            <button onclick="postBreakComment()" class="bg-gray-800 hover:bg-black text-xs px-3 py-1.5 rounded-lg text-white font-bold transition">送信</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // ================= Firebase 初期化 =================
    const firebaseConfig = {
      apiKey: "AIzaSyCrfjEagw3LSeT_yH23X0eO34YXYexbtXM",
      authDomain: "focus-room-cde5b.firebaseapp.com",
      projectId: "focus-room-cde5b",
      storageBucket: "focus-room-cde5b.firebasestorage.app",
      messagingSenderId: "346002140928",
      appId: "1:346002140928:web:0b4c4b1e0c63712bd5cde5",
      measurementId: "G-HZSNZTGFKE"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 自分のクライアントID
    let myId = localStorage.getItem('focus_user_id');
    if (!myId) {
      myId = 'user_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('focus_user_id', myId);
    }
    let myName = localStorage.getItem('focus_user_name') || '作業者_' + myId.slice(-3);

    // 状態管理
    let rooms = [];
    let currentRoom = null;
    let timerInterval = null;
    let workDuration = 25 * 60;
    let breakDuration = 5 * 60;
    let timeLeft = 25 * 60;
    let isRunning = false;
    let isBreak = false;
    let focusMinutesTotal = 0;
    let todos = [];
    let preEntryTodos = [];
    let hideAllDetails = false;
    let remoteMembers = [];

    // メディア
    let isCameraOn = false;
    let isScreenSharing = false;
    let cameraStream = null;
    let screenStream = null;

    // リスナー解除用関数
    let unsubscribeMembers = null;
    let unsubscribeTicker = null;

    window.onload = () => {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
      document.getElementById('user-nickname').value = myName;
      listenRooms();
    };

    // ルーム一覧のリアルタイム購読
    function listenRooms() {
      db.collection('rooms').onSnapshot((snapshot) => {
        rooms = [];
        snapshot.forEach((doc) => {
          rooms.push({ id: doc.id, ...doc.data() });
        });
        // なければデフォルト作成
        if (rooms.length === 0) {
          db.collection('rooms').doc('default_toeic').set({
            name: 'TOEIC 800点を目指す会',
            tags: ['TOEIC', '英語'],
            visibility: 'public'
          });
        }
        renderRooms();
      });
    }

    function renderRooms() {
      const q = document.getElementById('tag-search').value.toLowerCase();
      const list = document.getElementById('room-list');
      list.innerHTML = '';

      rooms.filter(r => (r.name || '').toLowerCase().includes(q) || (r.tags || []).some(t => t.toLowerCase().includes(q))).forEach(r => {
        const card = document.createElement('div');
        card.className = "bg-white border border-gray-200 hover:border-[#1d9bf0] p-5 rounded-2xl transition cursor-pointer flex flex-col justify-between shadow-sm";
        card.onclick = () => selectRoom(r.id);
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded ${r.visibility === 'public' ? 'bg-blue-50 text-[#1d9bf0]' : 'bg-gray-100 text-gray-500'}">${r.visibility === 'public' ? '公開' : 'リンク限定'}</span>
            </div>
            <h4 class="font-bold text-sm text-gray-900 mb-1">${r.name}</h4>
            <div class="flex gap-1 flex-wrap">
              ${(r.tags || []).map(t => `<span class="text-xs text-gray-400">#${t}</span>`).join(' ')}
            </div>
          </div>
          <button class="mt-4 w-full bg-[#eff3f4] hover:bg-[#1d9bf0] hover:text-white text-xs py-2 rounded-full font-bold text-gray-800 transition">入室する</button>
        `;
        list.appendChild(card);
      });
    }

    function openCreateModal() { document.getElementById('create-modal').classList.remove('hidden'); }
    function closeCreateModal() { document.getElementById('create-modal').classList.add('hidden'); }

    async function createRoom() {
      const name = document.getElementById('new-room-name').value.trim();
      if (!name) return alert('部屋名を入力してください');
      const tags = document.getElementById('new-room-tags').value.split(' ').filter(Boolean);
      const vis = document.getElementById('new-room-visibility').value;
      
      const docRef = await db.collection('rooms').add({
        name,
        tags,
        visibility: vis,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      closeCreateModal();
      selectRoom(docRef.id);
    }

    // 入室前ToDo準備
    function selectRoom(roomId) {
      currentRoom = rooms.find(r => r.id === roomId) || { id: roomId, name: '集中ルーム', tags: [], visibility: 'public' };
      preEntryTodos = [];
      renderPreEntryTodos();
      document.getElementById('entry-modal').classList.remove('hidden');
    }

    function addPreEntryTodo() {
      const inp = document.getElementById('pre-entry-input');
      const val = inp.value.trim();
      if (!val) return;
      preEntryTodos.push(val);
      inp.value = '';
      renderPreEntryTodos();
    }

    function removePreEntryTodo(idx) {
      preEntryTodos.splice(idx, 1);
      renderPreEntryTodos();
    }

    function renderPreEntryTodos() {
      const list = document.getElementById('pre-entry-todo-list');
      list.innerHTML = '';
      preEntryTodos.forEach((t, i) => {
        const div = document.createElement('div');
        div.className = "flex justify-between items-center bg-[#eff3f4] px-3 py-1.5 rounded-lg text-xs";
        div.innerHTML = `
          <span class="truncate flex-1">${t}</span>
          <button onclick="removePreEntryTodo(${i})" class="text-gray-400 hover:text-red-500 font-bold ml-2">×</button>
        `;
        list.appendChild(div);
      });
    }

    function confirmEntry() {
      const nick = document.getElementById('user-nickname').value.trim();
      if (nick) {
        myName = nick;
        localStorage.setItem('focus_user_name', myName);
      }
      document.getElementById('entry-modal').classList.add('hidden');
      todos = preEntryTodos.map(text => ({ text, done: false }));
      enterRoom();
    }

    async function enterRoom() {
      document.getElementById('lobby-view').classList.add('hidden');
      document.getElementById('room-view').classList.remove('hidden');
      document.getElementById('current-room-name').innerText = currentRoom.name;
      document.getElementById('current-room-vis').innerText = currentRoom.visibility === 'public' ? '公開' : 'リンク限定';
      document.getElementById('current-room-tags').innerText = (currentRoom.tags || []).map(t => `# ${t}`).join(' ');

      applyCustomTime();
      renderTodos();

      // Firestoreに自身の参加情報を登録
      await updateMyFirestoreState({
        name: myName,
        status: '休憩中',
        currentTodo: todos.length > 0 ? todos[0].text : '',
        isTodoPublic: true,
        focusTime: '0分',
        isCamera: false,
        isScreen: false,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      // メンバーのリアルタイム同期リスナー開始
      unsubscribeMembers = db.collection('rooms').doc(currentRoom.id).collection('members')
        .onSnapshot((snapshot) => {
          remoteMembers = [];
          snapshot.forEach((doc) => {
            remoteMembers.push({ id: doc.id, ...doc.data() });
          });
          renderMembers();
          updateWorkingCount();
        });

      // ティッカー通知リスナー開始
      unsubscribeTicker = db.collection('rooms').doc(currentRoom.id).collection('tickers')
        .orderBy('timestamp', 'desc').limit(1)
        .onSnapshot((snapshot) => {
          snapshot.forEach((doc) => {
            const data = doc.data();
            if (data.msg) document.getElementById('ticker').innerText = data.msg;
          });
        });

      pushTicker(`💡 ${myName} がルームに参加しました`);
    }

    async function leaveRoom() {
      stopCamera();
      stopScreenShare();
      clearInterval(timerInterval);

      if (currentRoom) {
        // 退室時にFirestoreから自分を削除
        await db.collection('rooms').doc(currentRoom.id).collection('members').doc(myId).delete();
      }
      if (unsubscribeMembers) unsubscribeMembers();
      if (unsubscribeTicker) unsubscribeTicker();

      document.getElementById('room-view').classList.add('hidden');
      document.getElementById('lobby-view').classList.remove('hidden');
    }

    // 自分のステータスをFirestoreに更新
    async function updateMyFirestoreState(data) {
      if (!currentRoom) return;
      await db.collection('rooms').doc(currentRoom.id).collection('members').doc(myId).set(data, { merge: true });
    }

    // タイマー関連
    function applyCustomTime() {
      const wMins = parseInt(document.getElementById('custom-work-mins').value) || 25;
      const bMins = parseInt(document.getElementById('custom-break-mins').value) || 5;
      workDuration = wMins * 60;
      breakDuration = bMins * 60;
      
      if (!isRunning) {
        timeLeft = isBreak ? breakDuration : workDuration;
        updateTimerDisplay();
      }
    }

    function updateTimerDisplay() {
      const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const s = (timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').innerText = `${m}:${s}`;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        switchToBreak();
      } else {
        switchToWork();
        isRunning = true;
        document.getElementById('timer-start-btn').innerText = '停止 (休憩へ)';
        pushTicker(`🎯 ${myName} が集中を開始しました`);
        
        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateTimerDisplay();
            if (!isBreak && timeLeft % 60 === 0) {
              focusMinutesTotal++;
              document.getElementById('total-focus-time').innerText = `${focusMinutesTotal}分`;
              updateMyFirestoreState({ focusTime: `${focusMinutesTotal}分` });
            }
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            if (!isBreak) {
              pushTicker(`🎉 1セット完了！休憩に入りましょう。`);
              alert('セット完了！休憩に入りましょう。');
              switchToBreak();
            } else {
              pushTicker(`☕ 休憩終了！次のセットを始めましょう。`);
              alert('休憩終了です！');
              switchToWork();
            }
          }
        }, 1000);
      }
    }

    function switchToBreak() {
      isBreak = true;
      timeLeft = breakDuration;
      document.getElementById('timer-state-label').innerText = '休憩中';
      document.getElementById('timer-state-label').className = 'text-xs tracking-widest text-amber-500 font-bold mb-2';
      document.getElementById('timer-start-btn').innerText = '集中を再開';
      document.getElementById('break-comment-box').classList.remove('hidden');
      
      if (isCameraOn) stopCamera();

      updateTimerDisplay();
      updateMyFirestoreState({ status: '休憩中' });
    }

    function switchToWork() {
      isBreak = false;
      timeLeft = workDuration;
      document.getElementById('timer-state-label').innerText = '作業中';
      document.getElementById('timer-state-label').className = 'text-xs tracking-widest text-[#1d9bf0] font-bold mb-2';
      document.getElementById('timer-start-btn').innerText = 'スタート';
      document.getElementById('break-comment-box').classList.add('hidden');

      updateTimerDisplay();
      updateMyFirestoreState({ status: '作業中' });
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      switchToWork();
    }

    function updateWorkingCount() {
      const working = remoteMembers.filter(m => m.status === '作業中').length;
      document.getElementById('active-working-count').innerText = `● ${working}人が集中作業中`;
    }

    // ToDo管理
    function renderTodos() {
      const container = document.getElementById('todo-list');
      container.innerHTML = '';
      todos.forEach((t, i) => {
        const item = document.createElement('div');
        item.className = "flex items-center justify-between p-2.5 bg-[#eff3f4] rounded-lg text-xs group";
        item.innerHTML = `
          <label class="flex items-center gap-2 flex-1 cursor-pointer truncate mr-2">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodoDone(${i})" class="rounded border-gray-300 text-[#1d9bf0] focus:ring-0">
            <span class="${t.done ? 'line-through text-gray-400' : 'text-gray-800'} break-all">${t.text}</span>
          </label>
          <button onclick="deleteTodo(${i})" class="text-gray-400 hover:text-red-500 font-bold px-1 transition" title="削除">×</button>
        `;
        container.appendChild(item);
      });
    }

    function addTodo() {
      const inp = document.getElementById('new-todo-input');
      const val = inp.value.trim();
      if (!val) return;
      todos.push({ text: val, done: false });
      inp.value = '';
      renderTodos();
      updateMyFirestoreState({ currentTodo: val });
    }

    function deleteTodo(index) {
      todos.splice(index, 1);
      renderTodos();
      const nextTodo = todos.find(t => !t.done);
      updateMyFirestoreState({ currentTodo: nextTodo ? nextTodo.text : '' });
    }

    function toggleTodoDone(index) {
      todos[index].done = !todos[index].done;
      if (todos[index].done) {
        pushTicker(`✅ ${myName} が「${todos[index].text}」を完了しました！`);
      }
      renderTodos();
      const nextTodo = todos.find(t => !t.done);
      updateMyFirestoreState({ currentTodo: nextTodo ? nextTodo.text : (todos[0] ? todos[0].text : '') });
    }

    function toggleTodoVisibility() {
      const isPub = document.getElementById('todo-public-toggle').checked;
      updateMyFirestoreState({ isTodoPublic: isPub });
    }

    function toggleDetailsAll() {
      hideAllDetails = !hideAllDetails;
      document.getElementById('collapse-all-btn').innerText = hideAllDetails ? '詳細を表示' : '詳細を隠す';
      renderMembers();
    }

    // メンバー一覧描画（同期されたFirestoreのリストを使用）
    function renderMembers() {
      const container = document.getElementById('members-container');
      container.innerHTML = '';

      remoteMembers.forEach((m) => {
        const isMe = m.id === myId;
        const card = document.createElement('div');
        card.className = "p-3 rounded-xl border border-gray-200 bg-white flex flex-col gap-2 shadow-xs";
        
        const isWorking = m.status === '作業中';
        const displayTodo = m.isTodoPublic ? (m.currentTodo || '設定なし') : '🔒 非公開';

        card.innerHTML = `
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full ${isWorking ? 'bg-emerald-500' : 'bg-amber-400'}"></span>
              <span class="font-bold text-xs text-gray-900">${m.name || 'ゲスト'} ${isMe ? '(自分)' : ''}</span>
            </div>
            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${isWorking ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">${m.status || '待機中'}</span>
          </div>

          <!-- カメラ & 画面共有の横並び -->
          <div class="grid grid-cols-2 gap-2 h-24">
            <div class="bg-[#eff3f4] border border-gray-200 rounded-lg flex items-center justify-center relative overflow-hidden text-[10px] text-gray-400 font-medium">
              ${isMe && isCameraOn 
                ? `<video id="active-local-video" autoplay playsinline muted class="w-full h-full object-cover"></video>` 
                : `<span>${m.isCamera ? 'カメラON' : 'カメラOFF'}</span>`}
            </div>

            <div class="bg-[#eff3f4] border border-gray-200 rounded-lg flex items-center justify-center relative overflow-hidden text-[10px] text-gray-400 font-medium">
              ${isMe && isScreenSharing 
                ? `<video id="active-screen-video" autoplay playsinline muted class="w-full h-full object-cover"></video>` 
                : `<span>${m.isScreen ? '画面共有中' : '画面共有OFF'}</span>`}
            </div>
          </div>

          <!-- やる事・集中時間（折りたたみ可能） -->
          <div class="${hideAllDetails ? 'hidden' : 'block'} text-[11px] text-gray-500 pt-1 border-t border-gray-100 space-y-0.5">
            <div><span class="text-gray-400">やる事:</span> <span class="text-gray-700 font-medium">${displayTodo}</span></div>
            <div><span class="text-gray-400">集中時間:</span> <span class="text-gray-700 font-medium">${m.focusTime || '0分'}</span></div>
            ${m.comment ? `<div class="text-amber-600 font-medium mt-1">💬 "${m.comment}"</div>` : ''}
          </div>
        `;
        container.appendChild(card);
      });

      if (isCameraOn && cameraStream) {
        const v = document.getElementById('active-local-video');
        if (v) v.srcObject = cameraStream;
      }
      if (isScreenSharing && screenStream) {
        const sv = document.getElementById('active-screen-video');
        if (sv) sv.srcObject = screenStream;
      }
    }

    // カメラ
    async function toggleCamera() {
      if (isBreak) {
        alert('休憩中はカメラをONにできません');
        return;
      }
      const btn = document.getElementById('camera-toggle-btn');
      if (!isCameraOn) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          isCameraOn = true;
          updateMyFirestoreState({ isCamera: true });
          btn.innerText = 'カメラ ON';
          btn.classList.add('bg-gray-900', 'text-white');
        } catch (err) {
          alert('カメラへのアクセスを許可してください');
        }
      } else {
        stopCamera();
      }
      renderMembers();
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      isCameraOn = false;
      updateMyFirestoreState({ isCamera: false });
      const btn = document.getElementById('camera-toggle-btn');
      if (btn) {
        btn.innerText = 'カメラ OFF';
        btn.classList.remove('bg-gray-900', 'text-white');
      }
    }

    // 画面共有
    async function toggleScreenShare() {
      const btn = document.getElementById('screen-share-btn');
      if (!isScreenSharing) {
        try {
          screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
          isScreenSharing = true;
          updateMyFirestoreState({ isScreen: true });
          btn.innerText = '画面共有 ON';
          btn.classList.add('bg-gray-900', 'text-white');

          screenStream.getVideoTracks()[0].onended = () => {
            stopScreenShare();
            renderMembers();
          };
        } catch (err) {
          console.log(err);
        }
      } else {
        stopScreenShare();
      }
      renderMembers();
    }

    function stopScreenShare() {
      if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
        screenStream = null;
      }
      isScreenSharing = false;
      updateMyFirestoreState({ isScreen: false });
      const btn = document.getElementById('screen-share-btn');
      if (btn) {
        btn.innerText = '画面共有';
        btn.classList.remove('bg-gray-900', 'text-white');
      }
    }

    // 休憩コメント
    function postBreakComment() {
      const inp = document.getElementById('break-comment-input');
      const val = inp.value.trim();
      if (!val) return;
      updateMyFirestoreState({ comment: val });
      pushTicker(`💬 ${myName}: "${val}"`);
      inp.value = '';
    }

    function pushTicker(msg) {
      if (!currentRoom) return;
      db.collection('rooms').doc(currentRoom.id).collection('tickers').add({
        msg,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    function copyRoomLink() {
      navigator.clipboard.writeText(window.location.href);
      alert('ルームのリンクをコピーしました');
    }
  </script>
</body>
</html>
